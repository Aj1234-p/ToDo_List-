<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  </head>
  <body>
    <div class="container">
      <h1>To-Do List</h1>
      <div class="input-todo-container todo">
        <input type="text" id="work-name" placeholder="Your Work" />
        <input type="date" id="deadline-date" placeholder="Deadline" />
        <select name="priority" id="select-priority">
          <option value="" disabled selected>Priority</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <button id="add-item-btn">Add Item</button>
      </div>
      <p class="list">Today's ToDoList</p>
      <div class="today-todo-list todo same-todo"></div>
      <p class="list">Future ToDoList</p>
      <div class="future-todo-list todo same-todo"></div>
      <p class="list">Completed ToDoList</p>
      <div class="completed-todo-list todo same-todo"></div>
    </div>
  </body>
  <script src="./script.js"></script>
</html>
